<!doctype html>
<html lang="__SITE_LANGUAGE__">

<head>
  <!-- Character set & viewport -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Color scheme: automatically follow system preference -->
  <meta name="color-scheme" content="light dark" />

  <!-- Theme color for browser UI (light & dark modes) -->
  <meta name="theme-color" content="__SITE_THEME_COLOUR__" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="__SITE_THEME_COLOUR_DARK__" media="(prefers-color-scheme: dark)">

  <!-- Favicons & Manifest (served from /public) -->
  <link rel="icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- No preconnects. Google (analytics) is contacted only after cookie consent, so never
       from here. The media host (posters, avatars) isn't used by the public pages, and the
       map fetches posters only when a country is opened or hovered, by when a connection
       opened at page load has usually been dropped again. -->

  <!-- Fonts the first view draws on every page: Poppins 400 (body text) and TravelFont
       (the h1 and the nav). The other Poppins weights load when text needs them. -->
  <link rel="preload" href="/src/assets/fonts/Poppins/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/src/assets/fonts/TravelFont/SFComicScript-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <!-- Fallback head, filled from constants at build (react-head replaces it; no canonical, this shell serves every URL) -->
  <title data-rh="">__SITE_TITLE__</title>
  <meta data-rh="" name="description" content="__SITE_DESCRIPTION__" />
  <meta data-rh="" property="og:type" content="website" />
  <meta data-rh="" property="og:site_name" content="__SITE_NAME__" />
  <meta data-rh="" property="og:title" content="__SITE_TITLE__" />
  <meta data-rh="" property="og:description" content="__SITE_DESCRIPTION__" />
  <meta data-rh="" property="og:image" content="__SITE_OG_IMAGE__" />
  <meta data-rh="" name="twitter:card" content="summary_large_image" />
  <meta data-rh="" name="twitter:title" content="__SITE_TITLE__" />
  <meta data-rh="" name="twitter:description" content="__SITE_DESCRIPTION__" />
  <meta data-rh="" name="twitter:image" content="__SITE_OG_IMAGE__" />
</head>

<body class="antialiased font-main">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
