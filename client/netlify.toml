# The temporary Netlify site (staging; the live site is on InMotion with public/.htaccess).
# Pre-rendering needs Chromium at build time (kept in node_modules so Netlify caches it)
[build]
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Redirects: dist/_redirects is written at build (scripts/prerender.mjs): first /api/* and /go/*
# passed through to the API (my-planet-view.vercel.app), so the browser only talks to this
# site and the sign-in cookie is its own (set VITE_API_URL to this site's address); then
# browser-only pages -> app shell, the rest 404.html
# Retired URLs: add a 301 per old path, e.g.
# [[redirects]]
#   from = "/old-path"
#   to = "/new-path"
#   status = 301

# The same headers as public/.htaccess (section 4): keep the two in step. Netlify serves
# HTTPS and compresses by itself.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://*.r2.dev https://*.eu.r2.cloudflarestorage.com https://*.cloudflarestream.com data: blob:; connect-src 'self' https://my-planet-view.vercel.app https://*.r2.dev https://*.eu.r2.cloudflarestorage.com https://*.cloudflarestream.com https://upload.videodelivery.net https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; media-src 'self' https://*.cloudflarestream.com https://*.eu.r2.cloudflarestorage.com blob: data:; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Only Vite's hashed build output is cached for good
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker (PWA): always checked, so a new deploy replaces it at once
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
