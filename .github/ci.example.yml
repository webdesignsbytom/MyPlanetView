# Example workflow — NOT active. GitHub only runs workflows from
# .github/workflows/, so to enable this for a real project, move it to
# .github/workflows/ci.yml.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'

defaults:
  run:
    working-directory: client

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Informational, not a hard gate — a lot of "unused" hits here are
  # scaffolded-but-not-yet-routed features (booking/newsletter/account
  # admin), not dead code. See client/knip.json for known exclusions and
  # CLAUDE.md for context.
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Check for unused files/exports/dependencies
        run: |
          npx knip --reporter markdown > knip-output.md || true
          {
            echo "## Knip report"
            echo
            echo "Review before deleting anything — some of this is scaffolded-but-not-yet-wired functionality, not dead code."
            echo
            cat knip-output.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat knip-output.md

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run lighthouse
